name: relion-5.0
channels:
  - conda-forge
dependencies:
  - pip
  - python=3.10
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      # verified compatible 2.7.1->2.13.0 (CPU wheels only - the +cu128 Blackwell
      # wheel at the top of this range has NOT been hardware-verified).
      - torch>=2.7.1,<=2.13.0
      - torchvision>=0.22.1,<=0.28.0
      - tqdm>=4.65.0,<=4.70.0
      - mrcfile>=1.4.3,<=1.5.4
      - starfile>=0.5.6,<=0.5.13
      - loguru>=0.7.0,<=0.7.3
      - scikit-learn>=1.3.0,<=1.7.2
      - umap-learn>=0.5.3,<=0.5.12
      - matplotlib>=3.7.2,<=3.10.9
      - morphosamplers>=0.0.13,<=0.0.16
      # 1->2 works via pydantic's v1 compat shim (deprecation warnings only) -
      # that shim is removed in v3.0, re-audit before crossing that line.
      - pydantic>=1.10.18,<=2.13.4
      # NOT safe for DynaMight's own evaluation/visualizer.py, which calls
      # add_points(edge_width=...) - renamed to border_width= upstream. DynaMight's
      # bug to fix, not a reason to hold relion back.
      - napari[all]>=0.4.18,<=0.8.0
      # 3.0.1 is the newest version ever published to PyPI - no bump exists.
      - tsnecuda==3.0.1
      - PyQt5>=5.15.9,<=5.15.11
      # a jump to 0.27.1 was verified API-clean but deferred - a much larger leap
      # across many releases than the other bumps in this file.
      - typer==0.9.0
      - biopython>=1.81,<=1.87
      # widened past <2.0 now that both numpy 2.0 blockers are fixed: relion's
      # own eer_trajectory_handler.py (np.str0, this same commit) and
      # DynaMight's grid.py (np.product, pending PR against upstream
      # DynaMight - see the git+ pin below). Ceiling matches the audit: no
      # other removed-symbol breaks found across all six repos up to 2.2.6.
      - numpy>=1.26.1,<=2.2.6
      # get_particle_poses/{spheres,filaments}.py import the deprecated private
      # scipy.spatial.transform.rotation submodule - fine through 1.15.3 (warning
      # only), slated for removal in a future SciPy major.
      - scipy>=1.11.2,<=1.15.3
      # previously installed transitively (unpinned); now pinned explicitly.
      - pandas>=2.0.3,<=2.3.3     # required (unconstrained) by topaz, DynaMight, model-angelo
      - pillow>=6.2.0,<=12.3.0    # required by topaz
      - einops<=0.8.2             # required (unconstrained) by model-angelo
      - tensorboard<=2.21.0       # required (unconstrained) by DynaMight
      # exact pins: fair-esm loads pretrained checkpoints by version-specific API.
      # pyhmmer's surface looks compatible with 0.12.1 on paper, but
      # model-angelo's maintainers already tried bumping it and reverted
      # (d7eef60 -> 655a3df) - a real break a static signature diff can't see.
      - fair-esm==1.0.3
      - pyhmmer==0.7.1
      # genuinely used: scripts/filament_selection.in (a CMake-templated script,
      # non-.py extension) calls sns.clustermap/sns.color_palette.
      - seaborn>=0.12.2,<=0.13.2
      # fastcluster/dill/future removed: zero usage across all 6 repos ("future"
      # matches were Python's own `from __future__ import` statements, not the
      # PyPI package). Pinned to each repo's HEAD as of 2026-08-05, for
      # reproducibility - previously unpinned git+https installs floated.
      - git+https://github.com/3dem/relion-classranker@352adf8b690ba56e9f4073cfee41c8fcad3dfb81
      - git+https://github.com/3dem/relion-blush@ab48e6380e66b9aaf52362e86e060e9b9d8a40fd
      # pinned to a fork commit, not upstream: fixes np.product (removed in
      # numpy 2.0) in grid.py, needed for the numpy ceiling above -
      # https://github.com/FlyinTeller/DynaMight/pull/new/fix/numpy2-product-compat
      # not yet merged upstream. Re-pin to the upstream commit once it is.
      - git+https://github.com/FlyinTeller/DynaMight@f650ea7d35522a7a323301f2605fbf7b71c049e6
      - git+https://github.com/3dem/topaz@c8dd487cbf9d27139d0d430068033fb90dd9a393
      - git+https://github.com/3dem/model-angelo@994945bdfa6e5368e0d62349a47792f4864eebc3
      - ".[vis]"
